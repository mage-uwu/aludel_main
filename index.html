<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aludel</title>
    <script>
      /* iOS does not shrink the layout viewport for the keyboard — it leaves the page tall and
         scrolls it to reveal the focused field, which is the jitter: the slab slides, the title
         bar leaves, and blurring snaps it all back. So the shell is sized from the VISUAL
         viewport instead and the document is pinned at 0,0, making a keyboard one deliberate
         resize rather than a fight. Lives here, not in src/, because it is a document-level
         concern that has to be right before the first paint — and note the LOC gate counts
         src/ and worker/ only, so this is off the meter; keep it to the viewport. */
      (function () {
        var v = window.visualViewport, root = document.documentElement, queued = 0, tall = 0;
        function measure() {
          queued = 0;
          /* a zoomed visual viewport reports fewer CSS pixels; resizing to that would shrink the
             app every time iOS auto-zooms a small field. Hold the last unzoomed height. */
          var zoomed = v && v.scale > 1.01;
          if (!zoomed) tall = (v ? v.height : window.innerHeight);
          root.style.setProperty("--vvh", tall + "px");
          /* the layout viewport never shrinks for a keyboard, so the gap between the two IS the
             keyboard. The app sheds its ornament while one is up — see index.css. */
          root.toggleAttribute("data-keys", !zoomed && window.innerHeight - tall > 120);
          if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
        }
        function fit() { if (!queued) queued = requestAnimationFrame(measure); }
        /* the skin the crew chose, before the first paint — anything later is a flash of the
           wrong world. "auto" is the absence of a choice and falls through to the device. */
        try { root.dataset.theme = localStorage.skin || "auto"; } catch (e) { /* private mode */ }
        measure();
        if (v) { v.addEventListener("resize", fit); v.addEventListener("scroll", fit); }
        addEventListener("resize", fit);
        addEventListener("orientationchange", fit);
        addEventListener("focusin", fit);
        addEventListener("focusout", fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
